name: Build Vite site (gh-pages)

on:
  push:
    branches:
      - gh-pages
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: siteweb/lessionApp
        run: npm ci

      - name: Build Vite project
        working-directory: siteweb/lessionApp
        run: npm run build
